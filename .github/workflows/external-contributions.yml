name: Update External Contributions

on:
  workflow_dispatch:
  schedule:
    # Primary refresh at 09:07 IST (03:37 UTC).
    # Fallback refresh at 14:07 IST (08:37 UTC) if the first scheduled event is delayed or dropped.
    # Keep both away from the start of the hour to reduce schedule contention.
    - cron: "37 3 * * *"
    - cron: "37 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/external-contributions.yml"
      - "scripts/update_external_contributions.py"

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: external-contributions-readme
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate external contribution section
        env:
          # Optional fine-grained token for higher API rate limits. GitHub's
          # built-in token remains the fallback and is still used by checkout for pushes.
          GITHUB_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: frpboy
        run: python scripts/update_external_contributions.py

      - name: Commit README changes when needed
        run: |
          if git diff --quiet -- README.md; then
            echo "The generated section is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh external contributions"
          git push
