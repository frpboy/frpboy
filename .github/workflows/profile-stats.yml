name: Profile Statistics Refresh

on:
  schedule:
    # Hourly at :43 - offset from the existing :37 contribution workflows and
    # away from top-of-hour schedule contention. GitHub may delay scheduled
    # runs under load; the collector tolerates gaps by design.
    - cron: "43 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/collect-profile-stats.js"
      - "src/**"

permissions:
  contents: write
  actions: write # manage the private exclusion-config fingerprint cache

concurrency:
  group: profile-stats-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (collector code)
        uses: actions/checkout@v4

      - name: Run tests before collecting
        run: node --test tests/*.test.js

      # Private bookkeeping: a salted, non-reversible fingerprint of the
      # normalized exclusion configuration, kept in the Actions cache (never
      # in the repo, the snapshot, or logs). The salt makes the hash immune
      # to dictionary attacks over the account's public repo names. A changed
      # or unrecorded fingerprint forces a full filtered rebuild, because the
      # events ledger carries no per-repo attribution and cannot be cleaned
      # retroactively. Cache eviction fails closed into a rebuild.
      - name: Restore exclusion configuration fingerprint
        uses: actions/cache/restore@v6
        with:
          path: .exclusions-fp-previous
          key: exclusions-fingerprint-v1

      - name: Compare exclusion configuration fingerprint
        env:
          PROFILE_EXCLUDE_REPOS: ${{ secrets.PROFILE_EXCLUDE_REPOS }}
          # Random salt secret; required so the fingerprint cannot be
          # dictionary-attacked even if it ever leaks.
          PROFILE_EXCLUDE_SALT: ${{ secrets.PROFILE_EXCLUDE_SALT }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, os
          raw = os.environ.get("PROFILE_EXCLUDE_REPOS", "")
          slugs = sorted(set(s.strip().lower() for s in raw.replace(",", " ").split() if s.strip()))
          salt = os.environ.get("PROFILE_EXCLUDE_SALT", "")
          fp = hashlib.sha256(("\n".join(slugs) + "|" + salt).encode()).hexdigest()
          with open(".exclusions-fp-current", "w") as f:
              f.write(fp + "\n")
          PYEOF
          if [ ! -f .exclusions-fp-previous ]; then
            echo "No exclusion configuration fingerprint on record; forcing a full filtered rebuild."
            echo "PROFILE_FORCE_REBUILD=1" >> "$GITHUB_ENV"
          elif ! cmp -s .exclusions-fp-previous .exclusions-fp-current; then
            echo "Exclusion configuration changed; forcing a full filtered rebuild."
            echo "PROFILE_FORCE_REBUILD=1" >> "$GITHUB_ENV"
          else
            echo "Exclusion configuration unchanged."
          fi
          rm -f .exclusions-fp-previous

      - name: Collect profile statistics
        env:
          # Optional user-scoped token for higher rate limits. The built-in
          # GITHUB_TOKEN (public data only) is the default and is sufficient.
          GITHUB_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          # REQUIRED private exclusion list: comma-separated owner/repo slugs
          # that must not appear in any published statistic. Kept as a secret
          # so the configured values never enter the repo, logs, or snapshot.
          # The collector FAILS CLOSED when this is unset, empty, or malformed:
          # no statistics are published at all rather than unfiltered ones.
          PROFILE_EXCLUDE_REPOS: ${{ secrets.PROFILE_EXCLUDE_REPOS }}
        run: node scripts/collect-profile-stats.js

      - name: Stage snapshot
        run: cp data/profile-stats.json /tmp/profile-stats-new.json

      - name: Publish snapshot to stats-data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats-data >/dev/null 2>&1; then
            git fetch origin stats-data
            git checkout -B stats-data origin/stats-data
          else
            git checkout --orphan stats-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp -f /tmp/profile-stats-new.json data/profile-stats.json
          git add data/profile-stats.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(stats): refresh profile statistics snapshot"
          git push origin stats-data || { git pull --rebase origin stats-data && git push origin stats-data; }

      # Record the new fingerprint only after a successful publish, and only
      # when a rebuild was forced (first run or configuration change). The
      # save action refuses an existing key, so delete the old entry first.
      - name: Delete stale fingerprint cache entry
        if: success() && env.PROFILE_FORCE_REBUILD == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete exclusions-fingerprint-v1 --repo "$GITHUB_REPOSITORY" || true

      - name: Save exclusion configuration fingerprint
        if: success() && env.PROFILE_FORCE_REBUILD == '1'
        uses: actions/cache/save@v6
        with:
          path: .exclusions-fp-current
          key: exclusions-fingerprint-v1
