<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Mode Toggle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup__header">
      <div>
        <h1>Dark Mode Toggle</h1>
        <p class="popup__subtitle">One-click dark mode for any site.</p>
      </div>
    </header>

    <section class="popup__section">
      <div class="toggle-row">
        <div>
          <span class="label">Dark mode</span>
          <span id="statusText" class="status">Loading...</span>
        </div>
        <button id="toggleButton" class="toggle-button" type="button">
          <span class="toggle-indicator"></span>
        </button>
      </div>
    </section>

    <section class="popup__section">
      <label class="label" for="darknessLevel">Darkness level</label>
      <div class="segmented" id="darknessLevel">
        <button class="segment" data-level="light" type="button">Light</button>
        <button class="segment" data-level="medium" type="button">Medium</button>
        <button class="segment" data-level="dark" type="button">Dark</button>
      </div>
    </section>

    <section class="popup__section">
      <div class="site-info">
        <span class="label">Current site</span>
        <span id="siteHostname" class="site-hostname">--</span>
      </div>
      <div class="list-buttons">
        <button id="whitelistButton" class="secondary-button" type="button">Whitelist site</button>
        <button id="blacklistButton" class="secondary-button" type="button">Blacklist site</button>
      </div>
    </section>

    <section class="popup__section popup__section--footer">
      <a class="link" href="settings.html" target="_blank" rel="noopener">Open settings</a>
      <span class="shortcut">Ctrl/Cmd + Shift + D</span>
    </section>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
<!-- Dark Mode Toggle by frpboy (https://github.com/frpboy) -->
